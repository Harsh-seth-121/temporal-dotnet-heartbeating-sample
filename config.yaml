# Every knob for the sandbox lives here. Any field may be omitted; the C# POCOs in
# src/Repro.Core/Config/ReproConfig.cs hold the defaults.
#
# Durations are Go-style strings, for example "150ms", "10s", "1m30s" and "0", parsed by
# GoDurationYamlConverter. That is deliberate: this file is meant to be dialled up
# and down while watching Grafana, and TimeSpan's own "00:00:00.150" form makes
# that miserable.
#
# Unknown keys are a HARD ERROR, not a warning. A misspelled `failurRate` that
# quietly means 0.0 is an afternoon spent staring at a flat panel.

address: localhost:7233
namespace: default

# Keep the hyphen. Core does NOT sanitize label values, so this appears as
# task_queue="repro-task-queue" on :8077, while the Temporal server's own tally
# metrics sanitize it to taskqueue="repro_task_queue" on :8000. One queue, two
# spellings, and you cannot join them. That asymmetry is new in the .NET port.
taskQueue: repro-task-queue

# Fixed ID for the starter, so `temporal workflow describe -w repro-workflow`
# always works. Loadgen generates its own per-run IDs instead.
workflowId: repro-workflow

# Temporal Cloud: set apiKey OR tls.certPath + tls.keyPath. Either turns TLS on.
# Keep secrets out of this committed file. Put them in config.local.yaml
# (gitignored) and pass --config config.local.yaml.
apiKey: ""
tls:
  certPath: ""
  keyPath: ""
  serverName: ""     # maps to TlsOptions.Domain; override when the cert CN differs
  serverCaPath: ""

# SDK metrics.
#
# The listen addresses MUST be a full IP:port. Go's ":8077" is accepted here and
# normalized, but Core itself parses these with Rust's SocketAddr, which rejects a
# bare ":port". They must also not be loopback: 127.0.0.1 is unreachable from the
# Prometheus container over host.docker.internal, and the only symptom is a DOWN
# target while `curl localhost:8077` on this host still works.
metrics:
  listenAddress: "0.0.0.0:8077"     # worker
  loadgenAddress: "0.0.0.0:8078"    # loadgen
  # MUST end in /metrics: prometheus-net appends /job/<job>/instance/<instance> to
  # this verbatim, and without the path every push 404s silently.
  pushgatewayUrl: "http://localhost:9091/metrics"
  pushJob: "temporal_starter"
  pushInstance: "local"             # keep STABLE; a run id here leaks Pushgateway groups
  # How long the starter waits after closing its client before the final push.
  # Core buffers metric updates and exposes no flush API, so this is a guess with a
  # knob on it. Too short and the last temporal_request samples are simply missing
  # from the Pushgateway, with no error.
  pushSettle: 2s

# Shape of the seed job. steps x stepDuration is roughly the activity's runtime.
# 60 x 1s is deliberately longer than Core's default top activity_execution_latency
# bucket (60s), which is why HistogramBuckets.cs overrides it.
job:
  steps: 60
  stepDuration: 1s

# LIVE, but reached INDIRECTLY, and the indirection is the interesting part.
# HeartbeatWorkflow never reads this file: it builds its ActivityOptions from
# JobInput.Activity, because options carried in the input are recorded in the history, so a
# replay reproduces them byte for byte, which a file you can edit between the original run
# and the replay cannot promise. ActivityOptionsInput.From(config.Activity) closes the gap,
# and both clients call it (Repro.Starter and Repro.LoadGen), so editing a value here really
# does change what the next run schedules.
#
# The fallback is what to know: JobInput.Activity is optional with a null default so an old
# history still deserializes, and a null falls back to ActivityOptionsInput's own defaults,
# which are exactly the values below. Change them here, not in the record.
activity:
  # REQUIRED for the activity to receive cancellation at all. The server only
  # communicates cancellation in the RESPONSE to a heartbeat RPC.
  #
  # Also the input to Core's throttle: min(heartbeatTimeout x 0.8,
  # worker.maxHeartbeatThrottleInterval). At 5s the SDK sends at most one heartbeat
  # every 4s no matter how often the activity calls Heartbeat(), so a resumed
  # attempt can redo up to 4 seconds of work. Resume must be idempotent.
  heartbeatTimeout: 5s
  startToCloseTimeout: 10m
  scheduleToCloseTimeout: 1h
  retry:
    initialInterval: 1s
    backoffCoefficient: 2.0
    maximumInterval: 10s
    maximumAttempts: 5     # 0 means unlimited

worker:
  # The SDK default is 0s. Zero grace plus a minute-long heartbeating activity is
  # the hang this repo demonstrates on purpose; set it to 0s together with
  # fault.ignoreCancellation to watch it.
  gracefulShutdownTimeout: 30s
  maxHeartbeatThrottleInterval: 60s
  defaultHeartbeatThrottleInterval: 30s
  # 0 leaves the SDK default (10000). Set to 1 or 2 to force sticky-cache evictions
  # and replay storms on demand. It is the only way to make the sticky-cache and
  # replay-pressure panels on the Bug Signals board move on a single laptop.
  maxCachedWorkflows: 0
  maxConcurrentActivities: 0      # 0 leaves the SDK default (100)
  maxConcurrentWorkflowTasks: 0

loadgen:
  # Go used 500ms/4 because its seed activity returned instantly. This one runs for
  # steps x stepDuration, so 500ms would skip almost every tick and `--rate` would
  # be a lie about what the process is doing.
  rate: 5s
  concurrency: 8
  steps: 20                       # shorter than job.steps so a board fills in under a minute

# Fault injection. All zero/false = the activity always succeeds and every failure,
# retry and heartbeat panel sits at zero.
#
# Shipped with the first two ON, like the Go original, so the dashboards move on the
# first run. The three heartbeat knobs are OFF: each one proves a specific claim and
# is meant to be turned on ONE AT A TIME while watching a named panel.
fault:
  # ONE roll per ATTEMPT, not per step: P(this attempt fails) IS this number. A
  # workflow therefore only fails when all activity.retry.maximumAttempts rolls come
  # up failure, 0.15^5 or about one in thirteen thousand, so at 0.15 the signals
  # board's outcome split is all `completed` and that is correct. Raise this to ~0.8
  # if you want to watch `failed`.
  failureRate: 0.15
  latency: 150ms        # added to every step, and included in repro_heartbeat_call_interval_ms

  # Sleep past heartbeatTimeout without heartbeating, on attempt 1 only. Two things
  # happen in order and both are the point: the server times the ATTEMPT out, and we
  # keep running anyway, because the only channel it has to tell us is the response
  # to a heartbeat RPC and we are not sending any.
  # Panel: heartbeat board "Heartbeat timeouts", and NOTHING ELSE. Attempt 2 is not
  # gated, runs normally and succeeds, so the workflow still ends `completed`. If you
  # came here looking for outcome -> timed_out, that is stopHeartbeating, below.
  stallPastHeartbeatTimeout: false

  # Keep doing work but never call Heartbeat(). Proves an activity that stops
  # heartbeating can never be cancelled.
  # Panel: heartbeat board "Heartbeat calls vs heartbeat RPCs". Both fall to zero
  # while repro_activity_progress keeps climbing. Unlike stallPastHeartbeatTimeout
  # this is not gated to attempt 1, so all five attempts heartbeat-time-out, the
  # retry policy is exhausted, and THIS is the knob that moves the signals board's
  # outcome split to timed_out.
  stopHeartbeating: false

  # Swallow OperationCanceledException and finish the batch on an uncancellable
  # token. Proves TemporalWorker.ExecuteAsync does not return until every executing
  # activity returns, and that gracefulShutdownTimeout does NOT bound that. It
  # only controls WHEN ctx.CancellationToken fires.
  # THIS WEDGES YOUR TERMINAL FOR THE REST OF THE BATCH. That is the demo.
  ignoreCancellation: false

  # The three knobs below belong to fileScan, and they are a LADDER: one claim each,
  # named panels each, meant to be turned on ONE AT A TIME. All three ship false.
  #
  # NOTE THIS IS WORKSTATION GC. ServerGarbageCollection is unset in
  # Directory.Build.props, so DOTNET_gcServer=1 raises the gen0 budget dramatically and
  # invalidates every magnitude quoted here and in docs/WORKFLOWS.md. DOTNET_GCgen0size
  # is how to pin the budget for a reproducible gen0 count.

  # Decode every scanned row to a string and throw it away.
  # Proves ALLOCATION IS NOT GROWTH: about 140 bytes of gen0 garbage per row, so
  # allocated lands near 2.4x bytes read and the LIVE heap floor stays flat.
  # Panels: repro_file_scan_bytes_allocated rate and gc_collected{gen="0"} climb, while
  # managed_heap_bytes sawtooths on a floor that does not move. Legible only because
  # the default raw-byte path allocates essentially nothing.
  decodeRowsToStrings: false

  # The same decode, retained in a List for the life of the attempt -- PRE-SIZED from
  # the corpus header, so the list's own doubling does not move the LOH panel for a
  # second, unrelated reason.
  # Proves RETENTION GROWS THE HEAP: the identical garbage becomes promoted live gen2.
  # Panels: managed_heap_bytes becomes a staircase with no falling edge, gen="1" and
  # gen="2" appear, gc_pause_percent rises and rows/s dips below target.
  # ConfigLoader REFUSES this together with fileScan.concurrency > 1: eight retained
  # scans of the 500 MB corpus is over 10 GB, and that failure is an OOM-killed worker
  # rather than the empty panel you were expecting.
  retainScannedRows: false

  # File.ReadAllBytes the whole corpus before the loop.
  # Proves A BIG READ IS ONE LOH OBJECT, and the LOH is not compacted by default, so
  # committed bytes step up and do not come back when the array dies.
  # Panels: loh_bytes steps to the file size AT THE NEXT GC -- MEASURED: it is read from
  # GCMemoryInfo, which describes the LAST collection, so a 100 MB ReadAllBytes left the
  # gauge on the previous GC's value until a gen2 collect landed. working_set_bytes steps and
  # stays, gen="2" appears. It does NOT produce a heartbeat timeout -- 500 MB off page
  # cache or NVMe is well under a second; that is stallPastHeartbeatTimeout. It is also
  # SYNCHRONOUS, so it holds an activity-task thread for its whole duration.
  slurpWholeFile: false

# SimpleNoActivity: a workflow with NO activities, driven entirely by messages. The
# loadgen runs this as a SECOND loop alongside the heartbeat one, on the same task queue
# and the same worker. Turn it off with `enabled: false` or `--no-simple`.
simple:
  enabled: true

  # Carried into SimpleInput and used as the WaitConditionAsync timeout, so a run nobody
  # signals still ends. KEEP IT UNDER demo-down.sh's drain budget, which is
  # worker.gracefulShutdownTimeout + 15 = 45s here. A longer bound means teardown
  # SIGKILLs the loadgen mid-run instead of draining it.
  maxDuration: 30s

  # Mean interval between starts. The actual interval is rate x [1-jitter, 1+jitter], so
  # starts do not land on a metronome and the task-queue backlog panel shows a real shape
  # instead of a flat line. jitter must stay under 1: at 1 the low end is zero and the
  # loop becomes a busy spin.
  rate: 3s
  jitter: 0.5
  concurrency: 8                  # at capacity a tick is SKIPPED, never queued

  # Each run gets a random number of messages, coin-flipped between the Poke signal and
  # the Add update, with a random gap up to messageGap between them.
  minMessages: 0
  maxMessages: 5
  messageGap: 250ms

  # CHAOS. Fraction of Add updates handed operands whose sum overflows an int. The
  # workflow's update VALIDATOR rejects those, and a rejected update writes nothing at all
  # to the event history. This is the only thing in the repo that proves that.
  overflowRate: 0.05

  # CHAOS. Fraction of runs sent one more message AFTER they have closed. The expected
  # result is an RpcException with StatusCode.NotFound, which the driver counts instead of
  # crashing on. A client that does not expect that is one bad deploy from a restart loop.
  raceRate: 0.10

  # Weighted dice for how each run ends. Only the ratio matters.
  #   stop   -> the Stop signal; server status Completed, EndedBy "stopped"
  #   cancel -> a real client CancelAsync; server status CANCELED. This is the only path
  #             that produces that status: a workflow cannot cancel ITSELF.
  #   expire -> send nothing and let maxDuration end it; Completed, EndedBy "expired"
  stopWeight: 5
  cancelWeight: 3
  expireWeight: 2

# WorkflowSimpleActivity: the ordinary shape, and the one the two blocks above do not
# cover. ONE activity that sleeps, then fetches the current weather from Open-Meteo, and
# returns the reading from [WorkflowRun], so it lands in the WorkflowExecutionCompleted
# event and `temporal workflow show -w <id>` prints the temperature in the payload.
#
# NO HEARTBEATS. Plain startToCloseTimeout plus a retry policy, which is what almost every
# real activity should be. Know the consequence before you try to cancel one: the server
# communicates cancellation only in the RESPONSE to a heartbeat RPC, so a client
# CancelAsync records the WORKFLOW as CANCELED while this activity runs to completion on
# its own schedule and its result is thrown away. Worker shutdown DOES reach it, because
# that token is local. HeartbeatWorkflow is the other half of the comparison.
#
# OFFLINE FALLBACK. If the TRANSPORT fails, say no egress in CI or no wifi on a plane, the
# activity logs a WARNING and returns a synthetic reading tagged source="synthetic"
# instead of failing, so the demo scripts stay green. A server that ANSWERED is never
# smoothed over: 429 and 5xx are retried, other 4xx and a changed schema fail
# non-retryably. Watch the source label as well as the outcome label.
#
# The loadgen runs this as a THIRD loop. Turn it off with `enabled: false` or
# `--no-simple-activity`, NOT `--no-simple`, which is the SimpleNoActivity loop.
simpleActivity:
  enabled: true

  # The activity sleeps this long BEFORE the HTTP call, inside the same attempt. In the
  # ACTIVITY, not Workflow.DelayAsync. The aim is a long activity: an occupied activity
  # slot, a real temporal_activity_execution_latency, a start-to-close timeout that can
  # actually fire. A workflow timer produces a TimerStarted/TimerFired pair and no activity
  # task at all.
  #
  # It also FLOORS repro_simple_activity_latency, which is why HistogramBuckets.cs carries
  # boundaries at 5100/5250/5500/6000. Change this and that row is wrong.
  sleepDuration: 5s

  # Must be at least sleepDuration + httpTimeout + 2s; ConfigLoader.Validate refuses less.
  # The 2s is headroom for activity-task scheduling and payload conversion. With no
  # heartbeat timeout, start-to-close is the ONLY activity timeout this workflow can
  # produce, which is also why its Classify matches TimeoutType.StartToClose and not
  # TimeoutType.Heartbeat.
  startToCloseTimeout: 30s

  # Hard bound on the Open-Meteo call, enforced by the activity itself so a slow endpoint
  # produces a logged fallback rather than an opaque server-side TimeoutFailure that cannot
  # tell you whether the sleep, DNS, TLS or the response ran long. A downed interface fails
  # fast; a BLACKHOLED route does not, which is the case this exists for.
  httpTimeout: 3s

  retry:
    initialInterval: 1s
    backoffCoefficient: 2.0
    maximumInterval: 10s
    # MUST be > 0 here, unlike activity.retry.maximumAttempts. 0 means UNLIMITED in
    # Temporalio.Common.RetryPolicy. Write 1 for "do not retry". Unlimited retries against
    # a THIRD-PARTY endpoint is the one place in this repo where a stuck run is also someone
    # else's problem, and it parks the loadgen past demo-down.sh's 45s drain budget.
    #
    # At 3 the worst-case run is 3 x (5s + 3s) + 3s backoff = 27s, comfortably inside it.
    maximumAttempts: 3

  # Seattle. Open-Meteo needs no API key and no account.
  # Validated to [-90, 90] / [-180, 180]: outside that Open-Meteo answers HTTP 400, which
  # the activity throws NON-retryably, so a typo fails every run on attempt 1 instead of
  # quietly falling back to synthetic. A config bug is not an outage.
  latitude: 47.6062
  longitude: -122.3321

  # A knob rather than a constant so the synthetic path is reachable by config edit instead
  # of by unplugging a laptop. Point it at http://127.0.0.1:1/forecast for an instant
  # connection-refused, and watch source="synthetic" appear on the signals board.
  baseUrl: "https://api.open-meteo.com/v1/forecast"

  # When true, an UNREACHABLE Open-Meteo throws instead of falling back to a synthetic
  # reading. Shipped OFF because demo-up.sh has to stay green with no egress. Set it
  # together with a dead baseUrl to watch the retry policy exhaust.
  #
  # It is NOT the only route to outcome="failed", and believing that will mislead you during
  # a real upstream incident. A server that ANSWERED already fails with the flag off: the
  # fallback only ever covers transport failure, so a non-retryable status, a changed
  # response schema, or a 429/5xx exhausting retry.maximumAttempts all end the run
  # outcome="failed" source="none" at the shipped setting. The flag decides what happens when
  # nobody answered at all.
  requireLiveWeather: false

  # Loadgen's third loop. Same jittered-interval, skip-at-capacity contract as `simple`,
  # and the same jitter formula (see Jitter.NextInterval).
  #
  # SLOWER than simple.rate on purpose, and not because of your laptop: this is the only
  # loop in the repo that calls a third-party API. 15s x 4 in flight is about 4 requests a
  # minute, ~5,760 a day, comfortably inside Open-Meteo's free tier, so a demo left running
  # overnight still does not get you blocked. simple.rate's 3s would be ~28,800 a day.
  rate: 15s
  jitter: 0.5
  concurrency: 4

# ---------------------------------------------------------------------------
# WorkflowLocalActivity: one CPU-bound LOCAL activity, in its OWN namespace.
#
# This is the only block with a namespace and task queue of its own, and that is not
# organisation. `history.workflowTaskHeartbeatTimeout` is declared server-side as
# NewNamespaceDurationSetting, so it can be filtered by NAMESPACE and by nothing finer.
# A dedicated namespace is the only way to drop it from 30m to 1m here while the other
# three workflows keep the stock default. The override itself lives in
# observability/dynamicconfig/development-sql.yaml.
#
# WHAT THIS CASE DEMONSTRATES. A local activity runs inside the WORKFLOW TASK. The SDK
# keeps that task alive with workflow task heartbeats, but only up to the heartbeat
# timeout; after that the server times the task out and reschedules it, and because a
# local activity's result is not written to history until it completes, EVERY LOCAL
# ACTIVITY IN THAT TASK RUNS AGAIN FROM THE BEGINNING. With durations drawn from
# 30s..2m against a 1m timeout, exactly two-thirds of runs hit it, and because the
# duration is fixed in the workflow input they hit it again on every re-execution.
# ---------------------------------------------------------------------------
localActivity:
  enabled: true

  # Its own namespace, created by observability/scripts/create-namespace.sh alongside
  # `default`. If this namespace does not exist the worker fails at connect time with an
  # opaque not-found; `temporal operator namespace list` is the check.
  namespace: repro-local-activity

  # Namespace-scoped, so reusing repro-task-queue would be legal. Kept distinct anyway:
  # one queue name in two namespaces makes every grep and every visibility query
  # ambiguous for a human, whatever the server thinks.
  taskQueue: repro-la-queue

  # The per-run duration draw, uniform on [minDuration, maxDuration], made CLIENT-SIDE by
  # the loadgen and then FIXED in the workflow input for the life of the run.
  #
  # The fixedness is what makes this a repro instead of a flake: a re-executing local
  # activity reads the same duration and takes just as long, so it times out again. A
  # duration re-drawn per attempt would eventually draw a short one and heal itself.
  #
  # P(re-execution) = (120 - 60) / (120 - 30) = 2/3 at these values against the 1m
  # heartbeat timeout. docs/WORKFLOWS.md quotes that number; change either bound and it
  # is wrong.
  minDuration: 30s
  maxDuration: 2m

  # DELIBERATELY UNREACHABLE. The SDK requires StartToClose or ScheduleToClose to be set,
  # so one must exist, but the burn is capped at maxDuration and the workflow task dies at
  # 1m, so 2m30s can never be reached. Documented as unreachable rather than dressed up as
  # a guard.
  startToCloseTimeout: 2m30s

  # ABOVE the 1m heartbeat timeout on purpose, which means IT NEVER FIRES. Its clock
  # restarts on every workflow-task re-dispatch, because sdk-core re-stamps
  # original_schedule_time on each fresh schedule and only persists it inside a marker --
  # and a local activity killed by a workflow task timeout never wrote one.
  #
  # SET IT BELOW 1m to switch this case from the failure to the documented FIX: the local
  # activity then fails with a timeout the workflow catches, and the workflow task is
  # never re-executed. That is the only regime where this field does anything, so
  # ConfigLoader deliberately does not forbid it.
  scheduleToCloseTimeout: 5m

  # THE ONLY RUNG THAT ACTUALLY STOPS THE LOOP. Server-enforced on the timer queue, passed
  # as WorkflowOptions.RunTimeout by the driver rather than carried in the input.
  #
  # It closes the run WITHOUT scheduling a workflow task, so workflow code never runs
  # again and cannot record an outcome. That is why repro_local_activity_completed has
  # three outcome values and not four, and why repro_pi_attempt_started -- emitted from
  # activity code, which does not replay -- is the primary signal for this case.
  runTimeout: 6m

  retry:
    initialInterval: 1s
    backoffCoefficient: 2.0
    maximumInterval: 10s
    # MUST be > 0, and the reason is stronger than it is for simpleActivity. An UNSET
    # RetryPolicy on a local activity means retry FOREVER, and 0 means unlimited in
    # Temporalio.Common.RetryPolicy, so both routes to "no policy" give an unbounded chain
    # of two-minute CPU burns. Write 1 for "do not retry", which is what this is.
    #
    # It does not bound the re-execution loop either way: a workflow-task-timeout
    # re-execution arrives as attempt 1 again, outside the retry policy.
    maximumAttempts: 1

  # Loadgen's fourth loop. Same jittered-interval, skip-at-capacity contract as the others.
  rate: 30s
  jitter: 0.5

  # Expected slot occupancy is about (1/3)(45s) + (2/3)(6m) = ~255s per run, so one slot
  # is busy essentially always. At concurrency 1 that is ~14 runs an hour with ~88% of
  # ticks skipped, i.e. one or two samples inside a 30-minute dashboard window, and a
  # sparse panel looks exactly like a broken target. Three makes the board legible without
  # pegging a laptop.
  concurrency: 3

  # The SDK default is 100. Leaving it there lets 100 concurrent CPU burns saturate the
  # thread pool, and workflow activations run on that same pool: the SDK fails any
  # workflow task that does not yield within 2 seconds, so a starved pool produces evicted
  # runs and retried workflow tasks that look exactly like this repro and are not it.
  #
  # Local activities have their own slot type, so this does not come out of
  # worker.maxConcurrentActivities. Core reports it as worker_type="LocalActivityWorker".
  maxConcurrentLocalActivities: 4

# ---------------------------------------------------------------------------
# WorkflowFileScan: a long, resumable scan of one generated corpus, paced on purpose.
#
# WHAT THIS CASE DEMONSTRATES, and what the other four cannot. The seed
# HeartbeatWorkflow heartbeats a Task.Delay step loop, and two things are out of that
# loop's reach no matter how you tune it:
#
#   RESUME CORRECTNESS. Nothing there is genuinely reprocessed, because a synthetic
#   step is idempotent by construction and there is no state a resume could get wrong.
#   Here the checkpoint carries a byte offset, a row cursor AND a running indexSum, the
#   accumulator is rewound to the checkpoint's value together with the read cursor, and
#   at the end the scan checks itself against the closed form n(n+1)/2. A resume that
#   double-counts is caught arithmetically instead of argued about.
#
#   WORKER RESOURCE PRESSURE. A sleeping task allocates nothing and touches no I/O, so
#   every slot, GC and memory panel reads identically whether the activity is working
#   or idle. A real read loop moves them, and the three fault knobs above move them one
#   claim at a time.
#
# The PACE is what makes both halves legible. Unthrottled, a raw-byte scan of the
# 500 MB corpus finishes in single-digit seconds -- shorter than ONE heartbeat throttle
# interval -- so the case would emit a single heartbeat and demonstrate neither.
#
# THE CORPUS IS GITIGNORED AND GENERATED: run scripts/gen-samples/gen-samples.sh first.
# Nothing in ConfigLoader stats it. Every value below is validated for SHAPE only, with
# no filesystem access at all, because the test suite loads THIS file and a fresh clone
# has no sample_files/. Existence is checked where it can be handled instead: the
# loadgen skips its loop with a named banner, and the activity throws NON-retryably,
# because a missing corpus is a config bug and burning ten retries proves nothing.
# ---------------------------------------------------------------------------
fileScan:
  enabled: true

  # RESOLVED AGAINST THIS FILE'S DIRECTORY, not the working directory, and rewritten to
  # an absolute path during validation. docs/HEARTBEATING.md's kill-the-worker recipe
  # runs the built binary from the repo root while demo-up.sh runs from elsewhere, so a
  # cwd-relative path would silently mean two DIFFERENT files across a resume, and the
  # checkpoint's corpus-identity check is the only thing that would ever notice.
  path: sample_files/sample-100mb.txt

  # Its OWN queue, in the SAME namespace as everything else -- so no second client,
  # only a second TemporalWorker. Not for isolation of the interesting kind: GC, the
  # thread pool and RSS are process-wide and stay shared, which is the point. It exists
  # because temporal_worker_task_slots_used carries NO activity_type label while the
  # heartbeat board's headline stat sums it unfiltered and claims this repo has exactly
  # one heartbeating activity type. A separate queue lets that panel pin task_queue and
  # exclude the scan exactly. ConfigLoader requires this name to be prefix-DISJOINT
  # from taskQueue and localActivity.taskQueue, not merely different from them.
  taskQueue: repro-scan-queue

  # THE KNOB THAT MAKES THIS A LONG-RUNNING ACTIVITY. 0 means unthrottled.
  #
  # 6000 puts the 100 MB corpus (1,724,588 rows) at 4m47s. At heartbeatTimeout 30s the
  # throttle is min(0.8 x 30s, worker.maxHeartbeatThrottleInterval) = 24s, so a kill -9
  # destroys the RECORD of 24 x 6000 = 144,000 rows: 8.35% of the corpus and an
  # unmissable drop on the cursor panel. At the seed case's 5s heartbeat timeout the
  # same drop is 1.4% -- visible on a panel, invisible in a demo.
  #
  # Pacing is also what makes GC pressure readable. Unthrottled, rows/s is a noisy
  # function of the page cache; pinned below the machine's ceiling the line is flat and
  # any dip in it is unambiguously pressure.
  targetRowsPerSecond: 6000

  # Rows between one pace, cancel, drain, heartbeat and log check and the next. 600 at
  # 6000 rows/s is a 100ms batch period, which IS the loop's reaction time to a drain.
  #
  # Batched, never per row: Task.Delay has a floor near 1ms and cannot express the
  # 167us a row implies, so a per-row sleep would run at about 1000 rows/s whatever
  # this file said and targetRowsPerSecond would be a lie. ConfigLoader keeps the batch
  # period inside [10ms, 2s] for both halves of that: batchRows 1000000 would be a
  # 167-second batch, inside which the activity could observe neither a drain nor a
  # cancel nor emit one heartbeat.
  batchRows: 600

  # One byte[] -- the scan finds line breaks itself, so unlike a StreamReader path
  # there is no char[] alongside it. A byte[n] reaches the 85,000-byte LOH threshold at
  # n >= 84,976, so 65536 is SOH and repro_file_scan_loh_bytes sits at a TRUE zero.
  # Raise it past ~83 KiB and the buffer moves to the LOH: the cheapest one-line
  # demonstration of that threshold in the repo, and the reason ConfigLoader's range
  # for this key deliberately spans it.
  bufferBytes: 65536

  # Stop after this many rows; 0 is the whole file. A checkpoint written under a LARGER
  # maxRows is a different job, and the activity refuses to resume from it rather than
  # silently answering a question nobody asked. It is also what the timeout ladder
  # below is derived against when set -- otherwise the largest SHIPPED corpus is.
  maxRows: 0

  # WALL CLOCK, not a row count, and one interval feeds both sinks: the console line
  # and the pressure sampler. A row-count cadence goes sparse exactly when the system
  # slows down, which is when you need it, and two independent samples would make
  # Grafana and the console disagree by a tick and send a reader after a discrepancy
  # that does not exist.
  logInterval: 10s

  # Chosen for the STALENESS it produces, NOT for liveness: the maximum gap between
  # two Heartbeat() calls here is one batch period, 100ms, so 30s is 300x margin. What
  # it actually sets is the throttle, and therefore how much work a kill -9 destroys
  # the record of.
  #
  # CEILING: worker.maxHeartbeatThrottleInterval is 60s, so raising this past 75s stops
  # increasing the throttle and the redone work plateaus at 60s x rate. The knob for
  # "make the lesson louder" saturates.
  heartbeatTimeout: 30s

  # Bounds ONE attempt, which for attempt 1 is the whole file. It COVERS the shipped
  # corpora rather than guarding anything -- the 500 MB corpus at 6000 rows/s is 23m57s
  # -- and it becomes a live guard the moment you drop the rate or point at something
  # bigger, at which point ConfigLoader fails at startup naming the value it needs. Its
  # honest role is catching an attempt that keeps heartbeating and never finishes.
  startToCloseTimeout: 30m

  # Total across every attempt, INCLUDING the cost of every resume. "attempts x
  # startToClose" is the wrong model and gives an absurd number: useful work is one
  # worst-case scan however many attempts it takes, and each RESUME adds
  # heartbeatTimeout (the server noticing) + retry.maximumInterval (backoff) + throttle
  # (the reading that is redone) = 64s at these values. Nine resumes on the 500 MB
  # corpus is 23m57s + 9 x 64s + 2m = 35m33s, so 1h leaves about 1.7x headroom.
  scheduleToCloseTimeout: 1h

  retry:
    initialInterval: 1s
    backoffCoefficient: 2.0
    maximumInterval: 10s
    # 10, not the usual 5, and NOT 0 -- zero means UNLIMITED in
    # Temporalio.Common.RetryPolicy, and an unbounded chain of half-hour scans holds an
    # activity slot forever. Each kill -9 spends one attempt and HEARTBEATING.md's
    # recipe does three cycles, so 5 leaves little room: one careless extra kill fails
    # the workflow terminally, which READS AS "resume is broken" and is the worst way
    # for this case to fail.
    maximumAttempts: 10

  # Loadgen's fifth loop. Same jittered-interval, skip-at-capacity contract as the
  # other three; 6m is just over one 4m47s scan, so a scan is in flight essentially
  # always without a second one ever being started.
  rate: 6m
  jitter: 0.2

  # A pure multiplier on every byte, allocation and buffer in this case, all sharing
  # ONE heap and ONE thread pool -- which is the reason it is 1 here, and the reason
  # ConfigLoader REFUSES it above 1 while fault.retainScannedRows is on.
  concurrency: 1
