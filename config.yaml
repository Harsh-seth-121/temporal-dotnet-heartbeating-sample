# Every knob for the sandbox lives here. Any field may be omitted; the C# POCOs in
# src/Repro.Core/Config/ReproConfig.cs hold the defaults.
#
# Durations are Go-style strings -- "150ms", "10s", "1m30s", "0" -- parsed by
# GoDurationYamlConverter. That is deliberate: this file is meant to be dialled up
# and down while watching Grafana, and TimeSpan's own "00:00:00.150" form makes
# that miserable.
#
# Unknown keys are a HARD ERROR, not a warning. A misspelled `failurRate` that
# quietly means 0.0 is an afternoon spent staring at a flat panel.

address: localhost:7233
namespace: default

# Keep the hyphen. Core does NOT sanitize label values, so this appears as
# task_queue="repro-task-queue" on :8077, while the Temporal server's own tally
# metrics sanitize it to taskqueue="repro_task_queue" on :8000. One queue, two
# spellings, and you cannot join them. That asymmetry is new in the .NET port.
taskQueue: repro-task-queue

# Fixed ID for the starter, so `temporal workflow describe -w repro-workflow`
# always works. Loadgen generates its own per-run IDs instead.
workflowId: repro-workflow

# Temporal Cloud: set apiKey OR tls.certPath + tls.keyPath. Either turns TLS on.
# Keep secrets out of this committed file -- put them in config.local.yaml
# (gitignored) and pass --config config.local.yaml.
apiKey: ""
tls:
  certPath: ""
  keyPath: ""
  serverName: ""     # maps to TlsOptions.Domain; override when the cert CN differs
  serverCaPath: ""

# SDK metrics.
#
# The listen addresses MUST be a full IP:port. Go's ":8077" is accepted here and
# normalized, but Core itself parses these with Rust's SocketAddr, which rejects a
# bare ":port". They must also not be loopback: 127.0.0.1 is unreachable from the
# Prometheus container over host.docker.internal, and the only symptom is a DOWN
# target while `curl localhost:8077` on this host still works.
metrics:
  listenAddress: "0.0.0.0:8077"     # worker
  loadgenAddress: "0.0.0.0:8078"    # loadgen
  # MUST end in /metrics: prometheus-net appends /job/<job>/instance/<instance> to
  # this verbatim, and without the path every push 404s silently.
  pushgatewayUrl: "http://localhost:9091/metrics"
  pushJob: "temporal_starter"
  pushInstance: "local"             # keep STABLE; a run id here leaks Pushgateway groups
  # How long the starter waits after closing its client before the final push.
  # Core buffers metric updates and exposes no flush API, so this is a guess with a
  # knob on it. Too short and the last temporal_request samples are simply missing
  # from the Pushgateway, with no error.
  pushSettle: 2s

# Shape of the seed job. steps x stepDuration is roughly the activity's runtime.
# 60 x 1s is deliberately longer than Core's default top activity_execution_latency
# bucket (60s), which is why HistogramBuckets.cs overrides it.
job:
  steps: 60
  stepDuration: 1s

# NOT WIRED YET, and this is the one block in this file that is not the source of
# truth. HeartbeatWorkflow builds its ActivityOptions from JobInput.Activity, on
# purpose: options carried in the input are recorded in the history, so a replay
# reproduces them byte for byte. ActivityOptionsInput.From(config.Activity) exists to
# project this block onto that input, but the starter and loadgen do not call it yet,
# so the workflow falls back to ActivityOptionsInput's defaults -- which are exactly
# the values below, which is why nothing looks wrong until you edit one. Editing
# heartbeatTimeout or startToCloseTimeout today only changes what ConfigLoader.Validate
# refuses to start on.
activity:
  # REQUIRED for the activity to receive cancellation at all -- the server only
  # communicates cancellation in the RESPONSE to a heartbeat RPC.
  #
  # Also the input to Core's throttle: min(heartbeatTimeout x 0.8,
  # worker.maxHeartbeatThrottleInterval). At 5s the SDK sends at most one heartbeat
  # every 4s no matter how often the activity calls Heartbeat(), so a resumed
  # attempt can redo up to 4 seconds of work. Resume must be idempotent.
  heartbeatTimeout: 5s
  startToCloseTimeout: 10m
  scheduleToCloseTimeout: 1h
  retry:
    initialInterval: 1s
    backoffCoefficient: 2.0
    maximumInterval: 10s
    maximumAttempts: 5     # 0 means unlimited

worker:
  # The SDK default is 0s. Zero grace plus a minute-long heartbeating activity is
  # the hang this repo demonstrates on purpose; set it to 0s together with
  # fault.ignoreCancellation to watch it.
  gracefulShutdownTimeout: 30s
  maxHeartbeatThrottleInterval: 60s
  defaultHeartbeatThrottleInterval: 30s
  # 0 leaves the SDK default (10000). Set to 1 or 2 to force sticky-cache evictions
  # and replay storms on demand -- it is the only way to make the sticky-cache and
  # replay-pressure panels on the Bug Signals board move on a single laptop.
  maxCachedWorkflows: 0
  maxConcurrentActivities: 0      # 0 leaves the SDK default (100)
  maxConcurrentWorkflowTasks: 0

loadgen:
  # Go used 500ms/4 because its seed activity returned instantly. This one runs for
  # steps x stepDuration, so 500ms would skip almost every tick and `--rate` would
  # be a lie about what the process is doing.
  rate: 5s
  concurrency: 8
  steps: 20                       # shorter than job.steps so a board fills in under a minute

# Fault injection. All zero/false = the activity always succeeds and every failure,
# retry and heartbeat panel sits at zero.
#
# Shipped with the first two ON, like the Go original, so the dashboards move on the
# first run. The three heartbeat knobs are OFF: each one proves a specific claim and
# is meant to be turned on ONE AT A TIME while watching a named panel.
fault:
  # ONE roll per ATTEMPT, not per step: P(this attempt fails) IS this number. A
  # workflow therefore only fails when all activity.retry.maximumAttempts rolls come
  # up failure -- 0.15^5, about one in thirteen thousand -- so at 0.15 the signals
  # board's outcome split is all `completed` and that is correct. Raise this to ~0.8
  # if you want to watch `failed`.
  failureRate: 0.15
  latency: 150ms        # added to every step, and included in repro_heartbeat_call_interval_ms

  # Sleep past heartbeatTimeout without heartbeating, on attempt 1 only. Two things
  # happen in order and both are the point: the server times the ATTEMPT out, and we
  # keep running anyway, because the only channel it has to tell us is the response
  # to a heartbeat RPC and we are not sending any.
  # Panel: heartbeat board "Heartbeat timeouts", and NOTHING ELSE. Attempt 2 is not
  # gated, runs normally and succeeds, so the workflow still ends `completed`. If you
  # came here looking for outcome -> timed_out, that is stopHeartbeating, below.
  stallPastHeartbeatTimeout: false

  # Keep doing work but never call Heartbeat(). Proves an activity that stops
  # heartbeating can never be cancelled.
  # Panel: heartbeat board "Heartbeat calls vs heartbeat RPCs" -- both fall to zero
  # while repro_activity_progress keeps climbing. Unlike stallPastHeartbeatTimeout
  # this is not gated to attempt 1, so all five attempts heartbeat-time-out, the
  # retry policy is exhausted, and THIS is the knob that moves the signals board's
  # outcome split to timed_out.
  stopHeartbeating: false

  # Swallow OperationCanceledException and finish the batch on an uncancellable
  # token. Proves TemporalWorker.ExecuteAsync does not return until every executing
  # activity returns, and that gracefulShutdownTimeout does NOT bound that -- it
  # only controls WHEN ctx.CancellationToken fires.
  # THIS WEDGES YOUR TERMINAL FOR THE REST OF THE BATCH. That is the demo.
  ignoreCancellation: false

# SimpleNoActivity: a workflow with NO activities, driven entirely by messages. The
# loadgen runs this as a SECOND loop alongside the heartbeat one, on the same task queue
# and the same worker. Turn it off with `enabled: false` or `--no-simple`.
simple:
  enabled: true

  # Carried into SimpleInput and used as the WaitConditionAsync timeout, so a run nobody
  # signals still ends. KEEP IT UNDER demo-down.sh's drain budget, which is
  # worker.gracefulShutdownTimeout + 15 = 45s here -- a longer bound means teardown
  # SIGKILLs the loadgen mid-run instead of draining it.
  maxDuration: 30s

  # Mean interval between starts. The actual interval is rate x [1-jitter, 1+jitter], so
  # starts do not land on a metronome and the task-queue backlog panel shows a real shape
  # instead of a flat line. jitter must stay under 1: at 1 the low end is zero and the
  # loop becomes a busy spin.
  rate: 3s
  jitter: 0.5
  concurrency: 8                  # at capacity a tick is SKIPPED, never queued

  # Each run gets a random number of messages, coin-flipped between the Poke signal and
  # the Add update, with a random gap up to messageGap between them.
  minMessages: 0
  maxMessages: 5
  messageGap: 250ms

  # CHAOS. Fraction of Add updates handed operands whose sum overflows an int -- the
  # workflow's update VALIDATOR rejects those, and a rejected update writes nothing at all
  # to the event history. This is the only thing in the repo that proves that.
  overflowRate: 0.05

  # CHAOS. Fraction of runs sent one more message AFTER they have closed. The expected
  # result is an RpcException with StatusCode.NotFound, which the driver counts instead of
  # crashing on. A client that does not expect that is one bad deploy from a restart loop.
  raceRate: 0.10

  # Weighted dice for how each run ends. Only the ratio matters.
  #   stop   -> the Stop signal; server status Completed, EndedBy "stopped"
  #   cancel -> a real client CancelAsync; server status CANCELED. This is the only path
  #             that produces that status: a workflow cannot cancel ITSELF.
  #   expire -> send nothing and let maxDuration end it; Completed, EndedBy "expired"
  stopWeight: 5
  cancelWeight: 3
  expireWeight: 2
