# After editing:  curl -XPOST http://localhost:9090/-/reload
# Target health:  http://localhost:9090/targets

global:
  # 1s is a choice, not a floor. Core's exporter has no flush timer, so unlike the Go SDK
  # there is no stale window to scrape around; 1s buys resolution, because at 5s a
  # heartbeat throttle interval or a slot count hitting zero is three points wide.
  #
  # It is also structural. The Grafana datasource sets timeInterval: 1s, so
  #   $__rate_interval = max($__interval + timeInterval, 4 * timeInterval) >= 4s.
  # A job scraped slower than 2s puts fewer than two samples in a 4s window and rate()
  # returns nothing, so every job feeding a panel stays on the global interval.
  #
  # Pushgateway (5s) is the one exemption, and not because those series are constant:
  # measured, rate(temporal_request{job="temporal_starter"}[4s]) was empty while the same
  # query on job="temporal-sdk-worker" returned 7 series. It is safe only because no panel
  # pins job="temporal_starter", so the group appears solely as a member of a
  # `sum by (...) (rate(...))`. Add such a panel and put this job back on 1s first.
  #
  # scrape_timeout must be <= scrape_interval and is set explicitly: Prometheus's 10s
  # default would be rejected against a 1s interval.
  scrape_interval: 1s
  scrape_timeout: 900ms
  evaluation_interval: 10s
  external_labels:
    env: sandbox

scrape_configs:
  - job_name: prometheus
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["localhost:9090"]

  # Temporal server, sibling container, resolved by Compose service name. Requires
  # PROMETHEUS_ENDPOINT=0.0.0.0:8000 on the temporal service. On "context deadline
  # exceeded" raise this job to 5s and 4s, but re-read the $__rate_interval note above.
  - job_name: temporal-server
    metrics_path: /metrics
    static_configs:
      - targets: ["temporal:8000"]
        labels:
          group: server-metrics
    # Copies namespace -> temporal_namespace, both surviving, so the upstream
    # temporalio/dashboards server board renders unedited. server-general.json
    # references temporal_namespace throughout, so this is mandatory.
    metric_relabel_configs:
      - source_labels: [namespace]
        target_label: temporal_namespace

  # Host-run .NET worker. The SDK wants PrometheusOptions("0.0.0.0:8077"), never a bare
  # ":8077" and never 127.0.0.1, which is unreachable from this container over
  # host.docker.internal. See docs/GOTCHAS.md, "`BindAddress` has no default and must not
  # be loopback".
  - job_name: temporal-sdk-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8077"]
        labels:
          group: sdk-metrics
          component: worker

  - job_name: temporal-sdk-loadgen
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8078"]
        labels:
          group: sdk-metrics
          component: loadgen

  # honor_labels: true is mandatory. Without it Prometheus overwrites the job and instance
  # labels the starter pushed, renaming them exported_job/exported_instance and breaking
  # any panel that groups by job. For why the starter pushes at all, see docs/GOTCHAS.md,
  # "The push path cannot use Core's exporter, and double-prefixes".
  - job_name: pushgateway
    honor_labels: true
    # 5s, not the global 1s. The reason it is safe is at the top of this file.
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: /metrics
    static_configs:
      - targets: ["pushgateway:9091"]
        labels:
          group: sdk-metrics
    # Strips the double prefix that MeterAdapter creates (docs/GOTCHAS.md). Renaming here
    # rather than in the dashboards lands pushed and scraped series on the same names.
    # MetricsOptions.MetricPrefix = "" is not an alternative: the empty string reads as
    # unset and falls back to "temporal_", while "zz_" really does give temporal_zz_request.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'temporal_temporal_(.+)'
        target_label: __name__
        replacement: 'temporal_${1}'

  - job_name: grafana
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
