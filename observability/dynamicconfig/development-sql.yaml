# Mounting this file is mandatory for temporalio/server:1.31.x; without it the server
# exits on startup. See docs/GOTCHAS.md, "The dynamicconfig mount is mandatory". Re-read
# on a fixed 60s poll, so edits apply without a restart but not instantly.

limit.maxIDLength:
  - value: 255
    constraints: {}

system.forceSearchAttributesCacheRefreshOnRead:
  - value: true
    constraints: {}

# Code default is 4. With a single .NET worker, 4 partitions split poller and backlog
# metrics into 4 thin series and make the matching panels look broken.
matching.numTaskqueueReadPartitions:
  - value: 1
    constraints: {}
matching.numTaskqueueWritePartitions:
  - value: 1
    constraints: {}

# Not set on purpose: frontend.enableUpdateWorkflowExecution and
# metrics.breakdownByTaskQueue/byPartition all default to true in 1.31.

# The knob the whole local-activity case turns on. Server default is 30m
# (common/dynamicconfig/constants.go, NewNamespaceDurationSetting, as of v1.31.2). Past
# this value the workflow task is timed out and every local activity in it runs again from
# the start; at 1m, with localActivity durations of 30s to 2m, two-thirds of runs hit it.
# The namespace constraint is forced, not tidiness: see docs/GOTCHAS.md,
# "`history.workflowTaskHeartbeatTimeout` is namespace-scoped and nothing finer".
# Mirrored as HeartbeatTimeoutMs in tests/Repro.Tests/TelemetryTests.cs, which asserts
# repro_local_activity_latency has a bucket boundary here.
history.workflowTaskHeartbeatTimeout:
  - value: 1m
    constraints:
      namespace: repro-local-activity
